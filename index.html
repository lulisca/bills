<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Controle Financeiro</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0d0f14;
    --surface: #161920;
    --surface2: #1e2130;
    --border: #2a2d3e;
    --text: #e8eaf0;
    --muted: #6b7080;
    --green: #2dce7a;
    --green-dim: rgba(45,206,122,0.12);
    --red: #ff5c5c;
    --red-dim: rgba(255,92,92,0.12);
    --gold: #f5a623;
    --gold-dim: rgba(245,166,35,0.12);
    --blue: #5b8dee;
    --blue-dim: rgba(91,141,238,0.12);
    --purple: #a78bfa;
    --radius: 14px;
    --radius-sm: 8px;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Inter', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    padding: 0 0 80px;
  }

  /* ── HEADER ── */
  .header {
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: 10px 14px 10px;
    position: sticky;
    top: 0;
    z-index: 100;
  }
  .header-top {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 10px;
  }
  .header h1 {
    font-size: 15px;
    font-weight: 800;
    letter-spacing: -0.5px;
    color: var(--text);
  }
  .header h1 span { color: var(--green); }

  .sync-btn {
    background: var(--green-dim);
    border: 1px solid rgba(45,206,122,0.3);
    color: var(--green);
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    padding: 6px 12px;
    border-radius: 20px;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 6px;
    transition: all .2s;
  }
  .sync-btn:hover { background: rgba(45,206,122,0.2); }
  .sync-dot {
    width: 6px; height: 6px;
    border-radius: 50%;
    background: var(--green);
    animation: pulse 2s infinite;
  }
  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.3; }
  }

  /* ── CARDS TOPO ── */
  .cards {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 6px;
  }
  .card {
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    padding: 8px 10px;
  }
  .card-label {
    font-family: 'JetBrains Mono', monospace;
    font-size: 9px;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.08em;
    margin-bottom: 3px;
  }
  .card-value {
    font-family: 'JetBrains Mono', monospace;
    font-size: 16px;
    font-weight: 500;
    letter-spacing: -0.5px;
  }
  .card-value.green { color: var(--green); }
  .card-value.red   { color: var(--red); }
  .card-value.gold  { color: var(--gold); }
  .card-value.blue  { color: var(--blue); }

  /* ── MAIN CONTENT ── */
  .container { padding: 20px; }

  /* ── SECTION TITLE ── */
  .section-title {
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--muted);
    margin: 24px 0 12px;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .section-title::after {
    content: '';
    flex: 1;
    height: 1px;
    background: var(--border);
  }

  /* ── BUDGET ROWS ── */
  .budget-row {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    padding: 12px 14px;
    margin-bottom: 8px;
  }
  .budget-top {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 8px;
  }
  .budget-name {
    font-size: 14px;
    font-weight: 600;
  }
  .budget-amounts {
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
    text-align: right;
  }
  .budget-spent { color: var(--red); }
  .budget-remaining { color: var(--green); font-size: 14px; font-weight: 500; }
  .budget-bar-bg {
    height: 4px;
    background: var(--border);
    border-radius: 99px;
    overflow: hidden;
  }
  .budget-bar-fill {
    height: 100%;
    border-radius: 99px;
    transition: width 0.4s ease;
  }
  .budget-orcamento {
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    color: var(--muted);
    margin-top: 4px;
  }

  /* ── INPUT RENDA ── */
  .renda-row {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    padding: 14px;
    margin-bottom: 8px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
  }
  .renda-label {
    font-size: 13px;
    font-weight: 600;
    color: var(--muted);
    white-space: nowrap;
  }
  .renda-input {
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    color: var(--blue);
    font-family: 'JetBrains Mono', monospace;
    font-size: 16px;
    font-weight: 500;
    padding: 8px 12px;
    text-align: right;
    width: 160px;
    outline: none;
    transition: border-color .2s;
  }
  .renda-input:focus { border-color: var(--blue); }

  .fixo-input {
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    color: var(--blue);
    font-family: 'JetBrains Mono', monospace;
    font-size: 14px;
    padding: 6px 10px;
    width: 120px;
    text-align: right;
    outline: none;
    transition: border-color .2s;
  }
  .fixo-input:focus { border-color: var(--blue); }

  /* ── ADD GASTO ── */
  .add-form {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 16px;
    margin-bottom: 16px;
  }
  .add-form h3 {
    font-size: 14px;
    font-weight: 700;
    margin-bottom: 14px;
    color: var(--text);
  }
  .form-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
    margin-bottom: 10px;
  }
  .form-field {
    display: flex;
    flex-direction: column;
    gap: 5px;
  }
  .form-field label {
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--muted);
  }
  .form-field input, .form-field select {
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    color: var(--text);
    font-family: 'JetBrains Mono', monospace;
    font-size: 14px;
    padding: 10px 12px;
    outline: none;
    width: 100%;
    transition: border-color .2s;
  }
  .form-field input:focus, .form-field select:focus { border-color: var(--green); }
  .form-field select option { background: var(--surface2); }

  .desc-field { grid-column: 1 / -1; }

  .add-btn {
    width: 100%;
    background: var(--green);
    color: #0d0f14;
    border: none;
    border-radius: var(--radius-sm);
    font-family: 'Inter', sans-serif;
    font-size: 14px;
    font-weight: 700;
    padding: 12px;
    cursor: pointer;
    letter-spacing: 0.04em;
    transition: all .2s;
  }
  .add-btn:hover { background: #25b568; transform: translateY(-1px); }
  .add-btn:active { transform: translateY(0); }

  /* ── LANCAMENTOS ── */
  .lancamento {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    padding: 12px 14px;
    margin-bottom: 8px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    animation: slideIn 0.2s ease;
  }
  @keyframes slideIn {
    from { opacity: 0; transform: translateY(-6px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  .lanc-left { flex: 1; min-width: 0; }
  .lanc-desc {
    font-size: 14px;
    font-weight: 600;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .lanc-meta {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    color: var(--muted);
    margin-top: 2px;
  }
  .lanc-right {
    display: flex;
    align-items: center;
    gap: 10px;
    flex-shrink: 0;
  }
  .lanc-valor {
    font-family: 'JetBrains Mono', monospace;
    font-size: 15px;
    font-weight: 500;
    color: var(--red);
  }
  .lanc-del {
    background: none;
    border: none;
    color: var(--muted);
    cursor: pointer;
    font-size: 16px;
    padding: 2px;
    transition: color .2s;
    line-height: 1;
  }
  .lanc-del:hover { color: var(--red); }

  /* ── STATUS TOAST ── */
  .toast {
    position: fixed;
    bottom: 20px;
    left: 50%;
    transform: translateX(-50%) translateY(80px);
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 10px 20px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
    color: var(--green);
    transition: transform 0.3s ease;
    z-index: 200;
    white-space: nowrap;
  }
  .toast.show { transform: translateX(-50%) translateY(0); }

  /* ── EMPTY STATE ── */
  .empty {
    text-align: center;
    color: var(--muted);
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
    padding: 24px 0;
  }

  /* ── CONFIG MODAL ── */
  .modal-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.7);
    z-index: 300;
    align-items: flex-end;
  }
  .modal-overlay.open { display: flex; }
  .modal {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius) var(--radius) 0 0;
    padding: 24px 20px;
    width: 100%;
    max-height: 80vh;
    overflow-y: auto;
    animation: slideUp 0.25s ease;
  }
  @keyframes slideUp {
    from { transform: translateY(100%); }
    to   { transform: translateY(0); }
  }
  .modal h2 {
    font-size: 16px;
    font-weight: 800;
    margin-bottom: 6px;
  }
  .modal p {
    font-size: 12px;
    color: var(--muted);
    margin-bottom: 20px;
    font-family: 'JetBrains Mono', monospace;
  }
  .modal-field {
    margin-bottom: 14px;
  }
  .modal-field label {
    display: block;
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 6px;
  }
  .modal-field input {
    width: 100%;
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    color: var(--text);
    font-family: 'JetBrains Mono', monospace;
    font-size: 14px;
    padding: 10px 12px;
    outline: none;
  }
  .modal-field input:focus { border-color: var(--blue); }
  .modal-btns {
    display: flex;
    gap: 10px;
    margin-top: 20px;
  }
  .modal-btns button {
    flex: 1;
    padding: 12px;
    border-radius: var(--radius-sm);
    font-family: 'Inter', sans-serif;
    font-size: 14px;
    font-weight: 700;
    cursor: pointer;
    border: none;
    transition: all .2s;
  }
  .btn-cancel {
    background: var(--surface2);
    color: var(--muted);
    border: 1px solid var(--border) !important;
  }
  .btn-save {
    background: var(--blue);
    color: #fff;
  }

  .config-btn {
    background: none;
    border: 1px solid var(--border);
    color: var(--muted);
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    padding: 6px 12px;
    border-radius: 20px;
    cursor: pointer;
  }

  /* ── BOTTOM NAV ── */
  .bottom-nav {
    position: fixed;
    bottom: 0; left: 0; right: 0;
    background: var(--surface);
    border-top: 1px solid var(--border);
    display: flex;
    z-index: 100;
    padding-bottom: env(safe-area-inset-bottom);
  }
  .nav-btn {
    flex: 1;
    background: none;
    border: none;
    color: var(--muted);
    font-family: 'Inter', sans-serif;
    font-size: 10px;
    font-weight: 600;
    padding: 10px 4px 8px;
    cursor: pointer;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 4px;
    transition: color .2s;
    letter-spacing: 0.04em;
    text-transform: uppercase;
  }
  .nav-btn .nav-icon { font-size: 20px; line-height: 1; }
  .nav-btn.active { color: var(--green); }

  /* ── TAB PANELS ── */
  .tab-panel { display: none; }
  .tab-panel.active { display: block; }

  /* ── ALERT BANNER ── */
  .alert-banner {
    background: var(--gold-dim);
    border: 1px solid rgba(245,166,35,0.3);
    border-radius: var(--radius-sm);
    padding: 14px 16px;
    margin-bottom: 8px;
    display: flex;
    align-items: flex-start;
    gap: 12px;
  }
  .alert-icon { font-size: 20px; flex-shrink: 0; }
  .alert-body { flex: 1; }
  .alert-title {
    font-size: 13px;
    font-weight: 700;
    color: var(--gold);
    margin-bottom: 3px;
  }
  .alert-text {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    color: var(--muted);
    line-height: 1.5;
  }
  .alert-value {
    font-family: 'JetBrains Mono', monospace;
    font-size: 18px;
    font-weight: 500;
    color: var(--gold);
    margin-top: 6px;
  }

  /* ── RESUMO TAB ── */
  .resumo-row {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    padding: 12px 14px;
    margin-bottom: 8px;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .resumo-label { font-size: 13px; font-weight: 600; }
  .resumo-val {
    font-family: 'JetBrains Mono', monospace;
    font-size: 14px;
    font-weight: 500;
  }

  /* ── GERENCIAR CATEGORIAS ── */
  .cat-item {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    padding: 10px 14px;
    margin-bottom: 6px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
  }
  .cat-item-left {
    display: flex;
    align-items: center;
    gap: 8px;
    flex: 1;
    min-width: 0;
  }
  .cat-item-name {
    font-size: 13px;
    font-weight: 600;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .cat-item-orc {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    color: var(--muted);
  }
  .cat-item-del {
    background: none;
    border: none;
    color: var(--muted);
    cursor: pointer;
    font-size: 16px;
    padding: 4px;
    transition: color .2s;
    flex-shrink: 0;
  }
  .cat-item-del:hover { color: var(--red); }

  .add-cat-form {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 14px;
    margin-bottom: 16px;
  }
  .add-cat-row {
    display: flex;
    gap: 8px;
    align-items: flex-end;
    flex-wrap: wrap;
  }
  .add-cat-row .form-field { flex: 1; min-width: 80px; }
  .add-cat-row .form-field.emoji-field { flex: 0 0 60px; min-width: 60px; }
  .add-cat-row .form-field.orc-field { flex: 0 0 100px; min-width: 100px; }
  .add-cat-btn {
    background: var(--green);
    color: #0d0f14;
    border: none;
    border-radius: var(--radius-sm);
    font-family: 'Inter', sans-serif;
    font-size: 13px;
    font-weight: 700;
    padding: 10px 14px;
    cursor: pointer;
    white-space: nowrap;
    transition: all .2s;
    flex-shrink: 0;
  }
  .add-cat-btn:hover { background: #25b568; }

  .cat-type-toggle {
    display: flex;
    gap: 0;
    margin-bottom: 14px;
    border-radius: var(--radius-sm);
    overflow: hidden;
    border: 1px solid var(--border);
  }
  .cat-type-btn {
    flex: 1;
    background: var(--surface2);
    border: none;
    color: var(--muted);
    font-family: 'Inter', sans-serif;
    font-size: 12px;
    font-weight: 600;
    padding: 10px;
    cursor: pointer;
    transition: all .2s;
  }
  .cat-type-btn.active {
    background: var(--green-dim);
    color: var(--green);
  }

  /* ── MOBILE IMPROVEMENTS ── */
  @media (max-width: 480px) {
    .header { padding: 8px 10px; }
    .header h1 { font-size: 14px; }
    .cards { gap: 4px; }
    .card { padding: 6px 8px; }
    .card-label { font-size: 8px; margin-bottom: 2px; }
    .card-value { font-size: 14px; }
    .container { padding: 12px 10px; }
    .section-title { font-size: 10px; margin: 18px 0 10px; }
    .renda-row { padding: 10px; gap: 8px; }
    .renda-label { font-size: 12px; }
    .renda-input { font-size: 14px; width: 130px; padding: 6px 10px; }
    .fixo-input { font-size: 13px; width: 100px; padding: 5px 8px; }
    .budget-row { padding: 10px 12px; }
    .budget-name { font-size: 13px; }
    .budget-spent { font-size: 11px; }
    .budget-remaining { font-size: 13px; }
    .form-grid { gap: 8px; }
    .form-field input, .form-field select { font-size: 13px; padding: 8px 10px; }
    .add-btn { font-size: 13px; padding: 10px; }
    .lancamento { padding: 10px 12px; gap: 8px; }
    .lanc-desc { font-size: 13px; }
    .lanc-meta { font-size: 10px; }
    .lanc-valor { font-size: 14px; }
    .nav-btn { font-size: 9px; padding: 8px 2px 6px; }
    .nav-btn .nav-icon { font-size: 18px; }
    .add-cat-row { flex-direction: column; }
    .add-cat-row .form-field { width: 100%; }
    .add-cat-row .form-field.emoji-field,
    .add-cat-row .form-field.orc-field { flex: 1; }
    .add-cat-btn { width: 100%; }
  }

</style>
</head>
<body>

<div class="header">
  <div>
    <div class="header-top">
      <h1>💰 <span>Grana</span></h1>
      <div style="display:flex;gap:8px;align-items:center">
        <button class="config-btn" onclick="openConfig()">⚙ config</button>
        <button class="sync-btn" onclick="syncData()">
          <span class="sync-dot"></span> salvo
        </button>
      </div>
    </div>
    <div class="cards" id="cards">
      <div class="card">
        <div class="card-label">Renda</div>
        <div class="card-value blue" id="card-renda">R$ 0</div>
      </div>
      <div class="card">
        <div class="card-label">Gasto</div>
        <div class="card-value red" id="card-gasto">R$ 0</div>
      </div>
      <div class="card">
        <div class="card-label">Saldo livre</div>
        <div class="card-value green" id="card-saldo">R$ 0</div>
      </div>
      <div class="card">
        <div class="card-label">Economia</div>
        <div class="card-value gold" id="card-economia">R$ 0</div>
      </div>
    </div>
  </div>
</div>

<div class="container">

  <!-- TAB: INÍCIO -->
  <div class="tab-panel active" id="tab-inicio">

    <!-- RENDA -->
    <div class="section-title">Renda do mês</div>
    <div class="renda-row">
      <span class="renda-label">💵 Renda total</span>
      <input class="renda-input" type="number" id="renda-input" placeholder="1133.00" step="0.01" oninput="saveAndRecalc()">
    </div>

    <!-- GASTOS FIXOS -->
    <div class="section-title">Gastos fixos</div>
    <div id="fixos-list"></div>

    <!-- OBSERVAÇÕES -->
    <div class="section-title" style="color:var(--red)">⚠ Observações</div>
    <div class="renda-row" style="gap:8px;border-color:rgba(255,92,92,0.3);background:var(--red-dim)">
      <input class="fixo-input" type="text" id="reserva-desc"
        placeholder="ex: faltando R$ 36,00 no orçamento"
        style="flex:1;width:auto;color:var(--red);font-size:13px;background:transparent;border-color:rgba(255,92,92,0.2)"
        oninput="state.reserva.desc=this.value; saveAndRecalc()">
      <input class="fixo-input" type="number" step="0.01" min="0" id="reserva-valor"
        placeholder="0,00"
        style="color:var(--red);background:transparent;border-color:rgba(255,92,92,0.2)"
        oninput="state.reserva.valor=parseFloat(this.value)||0; saveAndRecalc()">
    </div>

    <!-- ORÇAMENTO VARIÁVEIS -->
    <div class="section-title">Orçamento variáveis</div>
    <div id="budget-list"></div>

  </div>

  <!-- TAB: LANÇAR -->
  <div class="tab-panel" id="tab-lancar">
    <div class="section-title">Lançar gasto</div>
    <div class="add-form">
      <div class="form-grid">
        <div class="form-field">
          <label>Categoria</label>
          <select id="novo-cat"></select>
        </div>
        <div class="form-field">
          <label>Valor (R$)</label>
          <input type="number" id="novo-valor" placeholder="0,00" step="0.01" min="0">
        </div>
        <div class="form-field desc-field">
          <label>Descrição (opcional)</label>
          <input type="text" id="novo-desc" placeholder="ex: feira do sábado">
        </div>
      </div>
      <button class="add-btn" onclick="addLancamento()">+ Adicionar gasto</button>
    </div>

    <div class="section-title">Lançamentos</div>
    <div id="lancamentos-list"></div>
  </div>

  <!-- TAB: RESUMO -->
  <div class="tab-panel" id="tab-resumo">
    <div class="section-title">Resumo do mês</div>
    <div id="resumo-list"></div>
  </div>

  <!-- TAB: CATEGORIAS -->
  <div class="tab-panel" id="tab-categorias">
    <div class="section-title">Adicionar categoria</div>
    <div class="add-cat-form">
      <div class="cat-type-toggle">
        <button class="cat-type-btn active" onclick="setCatType('variavel')">Variável</button>
        <button class="cat-type-btn" onclick="setCatType('fixo')">Fixo</button>
      </div>
      <div class="add-cat-row">
        <div class="form-field emoji-field">
          <label>Emoji</label>
          <input type="text" id="new-cat-emoji" placeholder="🛒" maxlength="4">
        </div>
        <div class="form-field">
          <label>Nome</label>
          <input type="text" id="new-cat-nome" placeholder="ex: Transporte">
        </div>
        <div class="form-field orc-field" id="orc-field-wrap">
          <label>Orçamento</label>
          <input type="number" id="new-cat-orc" placeholder="0,00" step="0.01" min="0">
        </div>
        <button class="add-cat-btn" onclick="addCategoria()">+ Adicionar</button>
      </div>
    </div>

    <div class="section-title">Categorias variáveis</div>
    <div id="cat-var-list"></div>

    <div class="section-title">Categorias fixas</div>
    <div id="cat-fix-list"></div>
  </div>

</div>

<!-- BOTTOM NAV -->
<nav class="bottom-nav">
  <button class="nav-btn active" id="nav-inicio" onclick="switchTab('inicio')">
    <span class="nav-icon">🏠</span>início
  </button>
  <button class="nav-btn" id="nav-lancar" onclick="switchTab('lancar')">
    <span class="nav-icon">➕</span>lançar
  </button>
  <button class="nav-btn" id="nav-resumo" onclick="switchTab('resumo')">
    <span class="nav-icon">📊</span>resumo
  </button>
  <button class="nav-btn" id="nav-categorias" onclick="switchTab('categorias')">
    <span class="nav-icon">🏷</span>categorias
  </button>
</nav>


<!-- CONFIG MODAL -->
<div class="modal-overlay" id="config-modal" onclick="closeConfigOnOverlay(event)">
  <div class="modal">
    <h2>⚙ Configuração</h2>
    <p>Cole sua API Key do JSONBin para salvar na nuvem</p>
    <div class="modal-field">
      <label>JSONBin Master Key</label>
      <input type="password" id="jsonbin-key" placeholder="$2a$10$...">
    </div>
    <div class="modal-field">
      <label>Bin ID (deixe vazio na 1ª vez)</label>
      <input type="text" id="jsonbin-binid" placeholder="será criado automaticamente">
    </div>
    <div class="modal-btns">
      <button class="btn-cancel" onclick="closeConfig()">Cancelar</button>
      <button class="btn-save" onclick="saveConfig()">Salvar</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
// ── ESTADO ──────────────────────────────────────────────────────────────────
const CORES_PADRAO = ['#5b8dee','#a78bfa','#f5a623','#2dce7a','#ff5c5c','#e879f9','#38bdf8','#fb923c'];

const DEFAULT_CATS_VARIAVEIS = [
  { id: 'mercado',  nome: '🛒 Mercado/Alimentação', cor: '#5b8dee' },
  { id: 'lazer',    nome: '🎉 Lazer',                cor: '#a78bfa' },
  { id: 'bota',     nome: '👢 Bota',                 cor: '#f5a623' },
  { id: 'airbnb',   nome: '✈️ Airbnb',               cor: '#2dce7a' },
  { id: 'economia', nome: '💾 Economia',              cor: '#2dce7a' },
];

const DEFAULT_CATS_FIXOS = [
  { id: 'seguro',   nome: '🛡️ Seguro'   },
  { id: 'gasolina', nome: '⛽ Gasolina'  },
  { id: 'dizimo',   nome: '🙏 Dízimo'    },
  { id: 'mei',      nome: '🏢 MEI'       },
];

let state = {
  renda: 1133,
  fixos: { seguro: 0, gasolina: 0, dizimo: 0, mei: 0 },
  orcamentos: { mercado: 350, lazer: 500, bota: 120, airbnb: 100, economia: 100 },
  lancamentos: [],
  reserva: { desc: '', valor: 0 },
  catsVariaveis: null,
  catsFixos: null,
};

function getCatsVariaveis() {
  return state.catsVariaveis || DEFAULT_CATS_VARIAVEIS;
}
function getCatsFixos() {
  return state.catsFixos || DEFAULT_CATS_FIXOS;
}
function ensureCatsInState() {
  if (!state.catsVariaveis) state.catsVariaveis = JSON.parse(JSON.stringify(DEFAULT_CATS_VARIAVEIS));
  if (!state.catsFixos) state.catsFixos = JSON.parse(JSON.stringify(DEFAULT_CATS_FIXOS));
}

// ── LOCAL STORAGE ────────────────────────────────────────────────────────────
function loadLocal() {
  try {
    const s = localStorage.getItem('grana_state');
    if (s) state = JSON.parse(s);
  } catch(e) {}
}

function saveLocal() {
  localStorage.setItem('grana_state', JSON.stringify(state));
}

// ── JSONBIN ──────────────────────────────────────────────────────────────────
function getConfig() {
  return {
    key: localStorage.getItem('jsonbin_key') || '',
    binId: localStorage.getItem('jsonbin_binid') || '',
  };
}

async function syncData() {
  const { key, binId } = getConfig();
  if (!key) { showToast('⚙ Configure o JSONBin primeiro'); openConfig(); return; }

  const btn = document.querySelector('.sync-btn');
  btn.textContent = '⟳ salvando...';

  try {
    let url, method;
    if (!binId) {
      url = 'https://api.jsonbin.io/v3/b';
      method = 'POST';
    } else {
      url = `https://api.jsonbin.io/v3/b/${binId}`;
      method = 'PUT';
    }

    const res = await fetch(url, {
      method,
      headers: {
        'Content-Type': 'application/json',
        'X-Master-Key': key,
        'X-Bin-Name': 'grana',
        'X-Bin-Private': 'true',
      },
      body: JSON.stringify(state),
    });

    const data = await res.json();
    if (!binId && data.metadata?.id) {
      localStorage.setItem('jsonbin_binid', data.metadata.id);
    }

    showToast('✓ Salvo na nuvem');
    btn.innerHTML = '<span class="sync-dot"></span> salvo';
  } catch(e) {
    showToast('✗ Erro ao salvar');
    btn.innerHTML = '<span class="sync-dot"></span> salvo';
  }
}

async function loadFromCloud() {
  const { key, binId } = getConfig();
  if (!key || !binId) return;

  try {
    const res = await fetch(`https://api.jsonbin.io/v3/b/${binId}/latest`, {
      headers: { 'X-Master-Key': key }
    });
    const data = await res.json();
    if (data.record) {
      state = data.record;
      saveLocal();
      renderAll();
      showToast('✓ Dados carregados da nuvem');
    }
  } catch(e) {}
}

// ── CÁLCULOS ─────────────────────────────────────────────────────────────────
function totalFixos() {
  return Object.values(state.fixos).reduce((a, b) => a + (parseFloat(b) || 0), 0);
}

function gastosPorCat(catId) {
  return state.lancamentos
    .filter(l => l.cat === catId)
    .reduce((a, l) => a + l.valor, 0);
}

function totalVariaveis() {
  return state.lancamentos.reduce((a, l) => a + l.valor, 0);
}

function totalGasto() {
  return totalVariaveis();
}

// ── RENDER ───────────────────────────────────────────────────────────────────
function fmt(v) {
  return 'R$ ' + (parseFloat(v) || 0).toFixed(2).replace('.', ',').replace(/\B(?=(\d{3})+(?!\d))/g, '.');
}

function renderCards() {
  const renda = parseFloat(state.renda) || 0;
  const gasto = totalGasto();
  const saldo = renda - gasto;
  const eco   = gastosPorCat('economia');

  document.getElementById('card-renda').textContent   = fmt(renda);
  document.getElementById('card-gasto').textContent   = fmt(gasto);
  document.getElementById('card-saldo').textContent   = fmt(saldo);
  document.getElementById('card-saldo').className     = 'card-value ' + (saldo >= 0 ? 'green' : 'red');
  document.getElementById('card-economia').textContent = fmt(eco);
}

function renderFixos() {
  const el = document.getElementById('fixos-list');
  el.innerHTML = getCatsFixos().map(cat => `
    <div class="renda-row">
      <span class="renda-label">${cat.nome}</span>
      <input class="fixo-input" type="number" step="0.01" min="0"
        value="${state.fixos[cat.id] || ''}"
        placeholder="0,00"
        onchange="state.fixos['${cat.id}']=parseFloat(this.value)||0; saveAndRecalc()">
    </div>
  `).join('');
}

function renderBudget() {
  const el = document.getElementById('budget-list');
  el.innerHTML = getCatsVariaveis().map(cat => {
    const orc   = state.orcamentos[cat.id] || 0;
    const gasto = gastosPorCat(cat.id);
    const rest  = orc - gasto;
    const pct   = orc > 0 ? Math.min(100, (gasto / orc) * 100) : 0;
    const cor   = pct >= 100 ? '#ff5c5c' : pct >= 80 ? '#f5a623' : cat.cor;
    return `
      <div class="budget-row">
        <div class="budget-top">
          <span class="budget-name">${cat.nome}</span>
          <div class="budget-amounts">
            <div class="budget-spent">- ${fmt(gasto)}</div>
            <div class="budget-remaining">${fmt(rest)}</div>
          </div>
        </div>
        <div class="budget-bar-bg">
          <div class="budget-bar-fill" style="width:${pct}%;background:${cor}"></div>
        </div>
        <div style="display:flex;align-items:center;gap:8px;margin-top:6px">
          <span style="font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--muted)">orçamento:</span>
          <input class="fixo-input" type="number" step="0.01" min="0"
            value="${orc}"
            style="width:110px;font-size:12px;padding:4px 8px"
            onchange="state.orcamentos['${cat.id}']=parseFloat(this.value)||0; saveAndRecalc()">
        </div>
      </div>
    `;
  }).join('');
}

function renderLancamentos() {
  const el = document.getElementById('lancamentos-list');
  if (!state.lancamentos.length) {
    el.innerHTML = '<div class="empty">nenhum gasto lançado ainda</div>';
    return;
  }
  const sorted = [...state.lancamentos].reverse();
  el.innerHTML = sorted.map((l, ri) => {
    const i = state.lancamentos.length - 1 - ri;
    const cat = getCatsVariaveis().find(c => c.id === l.cat) || getCatsFixos().find(c => c.id === l.cat);
    return `
      <div class="lancamento">
        <div class="lanc-left">
          <div class="lanc-desc">${l.desc || cat?.nome || l.cat}</div>
          <div class="lanc-meta">${cat?.nome || l.cat} · ${l.data}</div>
        </div>
        <div class="lanc-right">
          <span class="lanc-valor">- ${fmt(l.valor)}</span>
          <button class="lanc-del" onclick="delLancamento(${i})">✕</button>
        </div>
      </div>
    `;
  }).join('');
}

function renderCatSelect() {
  const sel = document.getElementById('novo-cat');
  const allCats = [...getCatsFixos(), ...getCatsVariaveis()];
  sel.innerHTML = allCats.map(c => `<option value="${c.id}">${c.nome}</option>`).join('');
}

function renderAll() {
  document.getElementById('renda-input').value = state.renda || '';
  const rd = document.getElementById('reserva-desc');
  const rv = document.getElementById('reserva-valor');
  if (rd) rd.value = state.reserva?.desc || '';
  if (rv) rv.value = state.reserva?.valor || '';
  renderCards();
  renderFixos();
  renderBudget();
  renderLancamentos();
  renderAlert();
}

// ── TABS ─────────────────────────────────────────────────────────────────────
function switchTab(tab) {
  document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));
  document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
  document.getElementById('tab-' + tab).classList.add('active');
  document.getElementById('nav-' + tab).classList.add('active');
  if (tab === 'resumo') renderResumo();
  if (tab === 'categorias') renderCategorias();
}

// ── ALERT BANNER ─────────────────────────────────────────────────────────────
function renderAlert() {
  const renda = parseFloat(state.renda) || 0;
  const totalOrc = getCatsVariaveis().reduce((a, c) => a + (state.orcamentos[c.id] || 0), 0) + totalFixos();
  const meta = 100;
  const diff = totalOrc - (renda - meta);
  const el = document.getElementById('alert-diff');
  if (!el) return;
  if (diff > 0) {
    el.textContent = fmt(diff);
    el.style.color = 'var(--red)';
    el.previousElementSibling.textContent = 'Para fechar o mês com R$ 100 na conta, faltam cortar:';
  } else {
    el.textContent = fmt(Math.abs(diff)) + ' de sobra';
    el.style.color = 'var(--green)';
    el.previousElementSibling.textContent = 'Orçamento dentro do planejado! Sobram:';
  }
}

// ── RESUMO ───────────────────────────────────────────────────────────────────
function renderResumo() {
  const el = document.getElementById('resumo-list');
  if (!el) return;
  const renda = parseFloat(state.renda) || 0;
  const gasto = totalGasto();
  const saldo = renda - gasto;
  const rows = [
    { label: '💵 Renda', val: fmt(renda), cor: 'var(--blue)' },
    { label: '🔒 Fixos gastos', val: fmt(totalFixos()), cor: 'var(--red)' },
    ...getCatsVariaveis().map(c => ({
      label: c.nome,
      val: `${fmt(gastosPorCat(c.id))} / ${fmt(state.orcamentos[c.id] || 0)}`,
      cor: 'var(--text)'
    })),
    { label: '💰 Saldo final', val: fmt(saldo), cor: saldo >= 0 ? 'var(--green)' : 'var(--red)' },
  ];
  el.innerHTML = rows.map(r => `
    <div class="resumo-row">
      <span class="resumo-label">${r.label}</span>
      <span class="resumo-val" style="color:${r.cor}">${r.val}</span>
    </div>
  `).join('');
}


function saveAndRecalc() {
  const ri = document.getElementById('renda-input');
  if (ri) state.renda = parseFloat(ri.value) || 0;
  saveLocal();
  renderCards();
  renderBudget();
  renderAlert();
}

function addLancamento() {
  const cat   = document.getElementById('novo-cat').value;
  const valor = parseFloat(document.getElementById('novo-valor').value);
  const desc  = document.getElementById('novo-desc').value.trim();

  if (!valor || valor <= 0) { showToast('⚠ Digite um valor válido'); return; }

  const hoje = new Date().toLocaleDateString('pt-BR');
  state.lancamentos.push({ cat, valor, desc, data: hoje });
  saveLocal();

  document.getElementById('novo-valor').value = '';
  document.getElementById('novo-desc').value  = '';

  renderCards();
  renderBudget();
  renderLancamentos();
  renderAlert();
  showToast('✓ Gasto adicionado');
  syncData();
}

function delLancamento(i) {
  state.lancamentos.splice(i, 1);
  saveLocal();
  renderCards();
  renderBudget();
  renderLancamentos();
  showToast('Gasto removido');
  syncData();
}

// ── CONFIG MODAL ─────────────────────────────────────────────────────────────
function openConfig() {
  const { key, binId } = getConfig();
  document.getElementById('jsonbin-key').value   = key;
  document.getElementById('jsonbin-binid').value = binId;
  document.getElementById('config-modal').classList.add('open');
}
function closeConfig() {
  document.getElementById('config-modal').classList.remove('open');
}
function closeConfigOnOverlay(e) {
  if (e.target === document.getElementById('config-modal')) closeConfig();
}
function saveConfig() {
  const key   = document.getElementById('jsonbin-key').value.trim();
  const binId = document.getElementById('jsonbin-binid').value.trim();
  if (key) localStorage.setItem('jsonbin_key', key);
  if (binId) localStorage.setItem('jsonbin_binid', binId);
  closeConfig();
  showToast('✓ Configuração salva');
  if (binId) loadFromCloud();
}

// ── TOAST ────────────────────────────────────────────────────────────────────
let toastTimer;
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 2500);
}

// ── CATEGORIAS MANAGEMENT ────────────────────────────────────────────────
let newCatType = 'variavel';

function setCatType(type) {
  newCatType = type;
  document.querySelectorAll('.cat-type-btn').forEach(b => b.classList.remove('active'));
  event.target.classList.add('active');
  const orcWrap = document.getElementById('orc-field-wrap');
  orcWrap.style.display = type === 'variavel' ? '' : 'none';
}

function addCategoria() {
  ensureCatsInState();
  const emoji = document.getElementById('new-cat-emoji').value.trim() || '📌';
  const nome = document.getElementById('new-cat-nome').value.trim();
  if (!nome) { showToast('⚠ Digite um nome'); return; }

  const id = nome.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^a-z0-9]/g,'_').replace(/_+/g,'_');

  if (newCatType === 'variavel') {
    if (getCatsVariaveis().find(c => c.id === id)) { showToast('⚠ Categoria já existe'); return; }
    const orc = parseFloat(document.getElementById('new-cat-orc').value) || 0;
    const cor = CORES_PADRAO[state.catsVariaveis.length % CORES_PADRAO.length];
    state.catsVariaveis.push({ id, nome: `${emoji} ${nome}`, cor });
    state.orcamentos[id] = orc;
  } else {
    if (getCatsFixos().find(c => c.id === id)) { showToast('⚠ Categoria já existe'); return; }
    state.catsFixos.push({ id, nome: `${emoji} ${nome}` });
    state.fixos[id] = 0;
  }

  document.getElementById('new-cat-emoji').value = '';
  document.getElementById('new-cat-nome').value = '';
  document.getElementById('new-cat-orc').value = '';

  saveLocal();
  renderAll();
  renderCatSelect();
  renderCategorias();
  showToast('✓ Categoria adicionada');
  syncData();
}

function removeCategoria(type, id) {
  ensureCatsInState();
  const gastos = state.lancamentos.filter(l => l.cat === id);
  if (gastos.length > 0) {
    if (!confirm(`Essa categoria tem ${gastos.length} lançamento(s). Remover mesmo assim? Os lançamentos serão mantidos.`)) return;
  }

  if (type === 'variavel') {
    state.catsVariaveis = state.catsVariaveis.filter(c => c.id !== id);
    delete state.orcamentos[id];
  } else {
    state.catsFixos = state.catsFixos.filter(c => c.id !== id);
    delete state.fixos[id];
  }

  saveLocal();
  renderAll();
  renderCatSelect();
  renderCategorias();
  showToast('Categoria removida');
  syncData();
}

function renderCategorias() {
  const varList = document.getElementById('cat-var-list');
  const fixList = document.getElementById('cat-fix-list');
  if (!varList || !fixList) return;

  varList.innerHTML = getCatsVariaveis().map(cat => `
    <div class="cat-item">
      <div class="cat-item-left">
        <span class="cat-item-name">${cat.nome}</span>
        <span class="cat-item-orc">orc: ${fmt(state.orcamentos[cat.id] || 0)}</span>
      </div>
      <button class="cat-item-del" onclick="removeCategoria('variavel','${cat.id}')">✕</button>
    </div>
  `).join('');

  fixList.innerHTML = getCatsFixos().map(cat => `
    <div class="cat-item">
      <div class="cat-item-left">
        <span class="cat-item-name">${cat.nome}</span>
      </div>
      <button class="cat-item-del" onclick="removeCategoria('fixo','${cat.id}')">✕</button>
    </div>
  `).join('');
}

// ── INIT ─────────────────────────────────────────────────────────────────────
loadLocal();
renderCatSelect();
renderAll();
renderCategorias();
loadFromCloud();
</script>
</body>
</html>
